name: Deploy to Dev

on:
  push:
    branches:
      - develop
      - develop-gcp
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets: inherit

  deploy:
    uses: ./.github/workflows/deploy.yml
    needs: ci
    with:
      environment: dev
      service_prefix: om-dev
      image_tag: ${{ github.sha }}
    secrets: inherit
